name: swagga_x
description: "SWAGGA X - Premium AI-Powered Mobile Stylist App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.0.0
  
  # State Management
  provider: ^6.1.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # UI & Animations
  flutter_animate: ^4.2.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  
  # Image Handling & Optimization
  cached_network_image: ^3.3.1
  image_picker: ^1.0.4
  image_cropper: ^5.0.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  google_sign_in: ^6.2.0
  
  # AI & ML
  google_generative_ai: ^0.4.0
  tflite_flutter: ^0.10.0
  
  # Payments
  pay: ^2.1.0
  
  # Notifications
  firebase_messaging: ^14.7.0
  
  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  device_info_plus: ^9.1.0
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.7.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/fonts/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700